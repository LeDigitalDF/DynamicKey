<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DynamicKey Test Change Password</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        max-width: 480px;
        margin: 48px auto;
        padding: 0 16px;
      }
      label { display: block; margin-bottom: 8px; font-weight: 600; }
      input {
        width: 100%;
        padding: 10px 12px;
        font-size: 16px;
        margin-bottom: 16px;
      }
      .note {
        background: #f3f4f6;
        border-radius: 10px;
        padding: 12px 14px;
        margin-bottom: 20px;
        color: #4b5563;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <h1>Change password (test)</h1>
    <div class="note">
      Panel should show <strong>Change password</strong>. After verify, DynamicKey fills the <em>current</em> field with your saved Mac password and generates a new 24-character password for the new and confirm fields.
    </div>
    <form id="change-password-form" action="/change-password" onsubmit="event.preventDefault()">
      <label for="current">Current password</label>
      <input id="current" name="current" type="password" autocomplete="current-password" />
      <label for="new-password">New password</label>
      <input id="new-password" name="new-password" type="password" autocomplete="new-password" />
      <label for="confirm">Confirm new password</label>
      <input id="confirm" name="confirm" type="password" autocomplete="new-password" />
    </form>
  </body>
</html>
