<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DynamicKey Test Sign Up</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        max-width: 480px;
        margin: 48px auto;
        padding: 0 16px;
      }
      label { display: block; margin-bottom: 8px; font-weight: 600; }
      input {
        width: 100%;
        padding: 10px 12px;
        font-size: 16px;
        margin-bottom: 16px;
      }
      .note {
        background: #f3f4f6;
        border-radius: 10px;
        padding: 12px 14px;
        margin-bottom: 20px;
        color: #4b5563;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <h1>Create account (test)</h1>
    <div class="note">
      This form uses <code>autocomplete="new-password"</code> so DynamicKey should show the <strong>Sign up</strong> tag. A new 24-character site password is generated on first successful verify.
    </div>
    <form id="signup-form" action="/signup" onsubmit="event.preventDefault()">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" />
      <label for="confirm">Confirm password</label>
      <input id="confirm" name="confirm" type="password" autocomplete="new-password" />
    </form>
  </body>
</html>
